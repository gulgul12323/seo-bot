<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2030 청년 알짜 지원금 매일 알리미</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown-light.min.css">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            margin: 0;
            padding: 40px 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            padding: 35px 20px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
            margin-bottom: 30px;
            border: 1px solid #e2e8f0;
        }
        .header h1 {
            font-size: 1.8rem;
            color: #0f172a;
            margin: 0 0 10px 0;
            font-weight: 700;
        }
        .header p {
            color: #64748b;
            margin: 0;
            font-size: 1rem;
        }
        .post-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 35px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
            border: 1px solid #e2e8f0;
        }
        .markdown-body {
            font-family: inherit !important;
            font-size: 1.05rem !important;
            line-height: 1.7 !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔔 2030 청년 알짜 지원금 매일 알리미</h1>
            <p>놓치면 손해보는 전국 & 지자체 청년 혜택 리포트</p>
        </div>
        <div id="posts-list">
            <div class="post-card"><p>청년 알짜 지원금 리포트를 불러오는 중입니다...</p></div>
        </div>
    </div>

    <script>
        async function loadPosts() {
            const container = document.getElementById('posts-list');
            try {
                const res = await fetch('./posts.json?v=' + Date.now());
                if (!res.ok) throw new Error('Failed to load posts.json');
                const posts = await res.json();

                if (!posts || posts.length === 0) {
                    container.innerHTML = '<div class="post-card"><p>아직 등록된 지원금 리포트가 없습니다.</p></div>';
                    return;
                }

                container.innerHTML = '';
                posts.forEach(post => {
                    // title, description, date, tags 등의 메타데이터 라인과 --- 제거
                    let cleanMd = post.content
                        .replace(/^---[\s\S]*?---/, '')
                        .replace(/^(title|description|date|tags):\s*"?.*?"?/gm, '')
                        .trim();

                    const card = document.createElement('article');
                    card.className = 'post-card markdown-body';
                    card.innerHTML = marked.parse(cleanMd);
                    container.appendChild(card);
                });
            } catch (e) {
                console.error(e);
                container.innerHTML = '<div class="post-card"><p>지원금 리포트를 준비 중입니다.</p></div>';
            }
        }
        loadPosts();
    </script>
</body>
</html>
